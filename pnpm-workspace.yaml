packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^26.2.0
  commander: ^15.0.0
  "@resvg/resvg-js": ^2.6.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  "@vortexlabs/kirari": ^1.1.0
  html-to-image: ^1.11.13
  lit: ^3.3.3
  prettier: ^3.9.6
  lucide: ^1.31.0
  satori: ^0.29.0
  "@types/react": ^19.2.18
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@vortexlabs/kirari@1.1.0"
